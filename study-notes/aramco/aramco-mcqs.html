<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aramco Rigging MCQs — 200 Questions</title>
<style>
:root {
  --bg:#0b1220; --panel:#131e30; --panel2:#19263a;
  --text:#edf3fc; --muted:#9eafc7; --border:#2c3c54;
  --accent:#58a6ff; --green:#2ecc91; --red:#ff6b78;
}
* { box-sizing:border-box; }
body {
  margin:0; padding:20px; background:var(--bg); color:var(--text);
  font:16px/1.55 Arial, sans-serif;
}
main { max-width:1000px; margin:auto; }
header { margin-bottom:22px; }
h1 { font-size:clamp(25px,4vw,36px); margin:0 0 8px; }
.subtitle { color:var(--muted); margin:0; }
.panel,.question,.stats,.answer-key {
  background:var(--panel); border:1px solid var(--border);
  border-radius:12px; padding:18px; margin-bottom:16px;
}
.controls {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}
input[type="search"],select,button {
  width:100%; min-height:44px; border-radius:8px; padding:10px 12px;
  font:inherit; border:1px solid var(--border);
}
input[type="search"],select { background:var(--bg); color:var(--text); }
button {
  cursor:pointer; background:var(--accent); color:#07111f;
  font-weight:700; border:none;
}
button.secondary { background:var(--panel2); color:var(--text); border:1px solid var(--border); }
button:hover { filter:brightness(1.08); }
.stats {
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px; text-align:center;
}
.stat strong { display:block; font-size:25px; }
.stat span { color:var(--muted); font-size:13px; }
.tag { color:var(--accent); font-size:13px; font-weight:700; margin-bottom:6px; }
.question h3 { font-size:17px; margin:0 0 14px; }
.option {
  display:flex; gap:10px; align-items:flex-start;
  padding:11px; margin:8px 0; border:1px solid var(--border);
  border-radius:8px; cursor:pointer; background:var(--panel2);
}
.option input { margin-top:5px; flex-shrink:0; }
.option.correct { border-color:var(--green); background:#123328; }
.option.incorrect { border-color:var(--red); background:#3b202b; }
.feedback { margin-top:12px; font-weight:600; }
.feedback.good { color:var(--green); }
.feedback.bad { color:var(--red); }
.answer-key { display:none; }
.key-item { padding:12px 0; border-bottom:1px solid var(--border); }
.key-item:last-child { border-bottom:none; }
.empty { color:var(--muted); padding:20px 0; }
@media(max-width:520px) {
  body { padding:12px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .panel,.question,.stats,.answer-key { padding:14px; }
}
@media print {
  body { background:white; color:black; padding:0; }
  .panel,.stats,.question,.answer-key { background:white; color:black; border:1px solid #aaa; break-inside:avoid; }
  .controls,.feedback,.option input,.subtitle { display:none !important; }
  .option { background:white; color:black; border:1px solid #ccc; }
  .tag { color:#333; }
  .answer-key { display:block !important; }
}
</style>
</head>
<body>
<main>
<header>
  <h1>Aramco Rigging MCQs</h1>
  <p class="subtitle">Rigging, lifting operations, crane safety, PPE and emergency response practice quiz.</p>
</header>

<section class="panel">
  <div class="controls">
    <input id="search" type="search" placeholder="Search questions or answers..." aria-label="Search questions">
    <select id="topicFilter" aria-label="Filter by topic">
      <option value="">All topics</option>
    </select>
    <button id="checkBtn">Check Answers</button>
    <button id="keyBtn" class="secondary">Show Answer Key</button>
    <button id="printBtn" class="secondary">Print / Save PDF</button>
    <button id="resetBtn" class="secondary">Reset Answers</button>
  </div>
</section>

<section class="stats" aria-live="polite">
  <div class="stat"><strong id="total">0</strong><span>Questions shown in bank</span></div>
  <div class="stat"><strong id="answered">0</strong><span>Answered</span></div>
  <div class="stat"><strong id="correct">0</strong><span>Correct</span></div>
  <div class="stat"><strong id="score">—</strong><span>Score among answered</span></div>
</section>

<section id="questions" aria-live="polite"></section>

<section id="answerKey" class="answer-key">
  <h2>Answer Key</h2>
  <div id="keyContent"></div>
</section>
</main>

<script>
"use strict";

/*
  Question format:
  [topic, question, optionA, optionB, optionC, optionD,
   correctAnswerIndex, explanation]

  Indexes: 0 = A, 1 = B, 2 = C, 3 = D.
  Add the remainder of your question bank to this array.
*/
const bank = [
["Lift Planning","What should happen before a lifting operation begins?","Start immediately","Verify the approved lift plan, equipment, personnel and work area","Test the load by lifting it high","Let the operator decide everything",1,"Confirm the plan and required controls before beginning."],
["Lift Planning","What should be done if the actual lift differs from the approved plan?","Continue if it looks safe","Change the plan after the lift","Stop and obtain the required reassessment and approval","Ask a worker to improvise",2,"Changes must be assessed and authorized before proceeding."],
["Load Calculations","What should be included when determining the total suspended load?","Load, rigging and applicable lifting accessories","Only the cargo label","Only the crane hook","Only the load's estimated weight",0,"Use a verified weight basis that includes relevant suspended components."],
["Load Calculations","What should you do if the load weight is unknown?","Estimate by appearance","Lift it briefly to test the crane","Use the weight from another load","Obtain reliable weight information before lifting",3,"Capacity decisions must not rely on an unverified load weight."],
["Slings","What should be done if a sling has cuts or other damage?","Use it for a smaller load","Remove it from service and follow inspection procedures","Cover the damage with tape","Use two damaged slings together",1,"Damaged lifting accessories must not be used unless appropriately assessed and cleared."],
["Slings","Why must sling angle be considered?","It changes the load's color","It eliminates the need for a load chart","Sling tension can increase as the angle changes","It makes every lift a critical lift",2,"Sling geometry affects the force carried by each leg."],
["Shackles","What should be checked before using a shackle?","Identification, condition, rating and compatible assembly","Only its paint color","Only whether it fits in a pocket","Whether it is heavier than the sling",0,"Use correctly identified, serviceable and compatible lifting components."],
["Hooks","What should be done if a hook safety latch is damaged where one is required?","Hold it closed by hand","Use the hook only for a short lift","Tie it with rope","Stop and replace or repair it under the approved procedure",3,"Required safety devices must be functional before use."],
["Crane Setup","Why must ground conditions be checked before crane setup?","Ground condition only affects travel speed","Weak ground may cause settlement or loss of stability","The crane automatically detects every ground problem","Ground checks replace the load chart",1,"Crane support must be suitable for the imposed loads."],
["Crane Setup","What should be verified when positioning outriggers?","That they are painted","That they are extended as far as possible in every situation","The approved setup, support conditions and applicable manufacturer requirements","That workers stand beside them",2,"Use the approved configuration and suitable support arrangements."],
["Signals","What should the operator do if a required signal is unclear?","Stop movement until communication is clear","Guess what the signaler meant","Move slowly without confirmation","Follow whichever signal is given last",0,"Do not continue when required communication is unclear."],
["Signals","What should happen if the signaler gives a stop signal?","Ignore it unless the load is heavy","Continue to the landing area","Ask another worker to override it","Stop the movement safely",3,"Stop signals must be acted on promptly."],
["Exclusion Zones","Why must people be kept clear of a suspended load?","It improves radio reception","The load could fall, swing or shift","It makes the crane faster","It replaces the lift plan",1,"People must not be exposed to suspended-load hazards."],
["Exclusion Zones","What should be done if someone enters the lifting danger area?","Continue if the person is trained","Ask the person to duck","Stop the lift and restore effective area control","Move the load over the person",2,"Resume only when the danger area is controlled."],
["Weather","What should be done if wind exceeds the applicable operating limit?","Stop the lift and follow the approved procedure","Continue with extra workers holding the load","Ignore it if the load is heavy","Lift faster",0,"Observe the applicable equipment and site wind limits."],
["Weather","Why can wind be a hazard for a large flat load?","It changes the sling color","It reduces the load's weight","It eliminates the need for tag lines","Wind can create substantial force and load movement",3,"Consider wind exposure and the load's projected area."],
["PPE","What should a worker do if eye protection is unsuitable for the task?","Continue carefully","Stop and obtain appropriate protection for the task","Remove all eye protection","Ask another worker to carry the load",1,"Visibility and eye protection must both be suitable for the hazard."],
["PPE","Why is high-visibility clothing useful in lifting areas?","It replaces barriers","It guarantees the operator sees everything","It helps personnel be seen by operators and coworkers","It prevents load swing",2,"High visibility supports awareness but does not replace segregation and communication."],
["PPE","What should happen if PPE requirements conflict with the planned work method?","Pause and resolve the issue with the responsible safety authority","Ignore the PPE requirement","Remove the barrier instead","Proceed because the plan is approved",0,"Resolve conflicts before starting."],
["Permit and Procedures","Why must a required work permit be valid before a lift begins?","It determines load weight automatically","It makes equipment inspection unnecessary","It confirms required authorizations and controls are in place","It replaces the lift plan",2,"Permits and lift plans serve related but different control purposes."],
["Permit and Procedures","What should be done if the actual task falls outside the permit scope?","Stop and obtain the required review or permit revision","Continue if the crane is already set up","Change the description afterward","Ask an unbriefed worker to approve it",0,"The permit scope and controls must match the work."],
["Emergency Response","What should happen if rigging fails or a suspended load becomes unstable?","Attempt to catch the load","Run beneath it to guide it","Stand in the drop zone","Warn others, keep clear and follow emergency procedures",3,"Never attempt to catch a falling load."],
["Emergency Response","What should be done after a lifting near miss?","Ignore it if nobody was injured","Report it and preserve relevant information","Continue without checking equipment","Blame the nearest worker immediately",1,"Near-miss reporting helps prevent recurrence."],
["Competency","Why must riggers be competent for their assigned tasks?","Experience never matters","It replaces supervision","They need the knowledge and practical ability to work safely","It makes every lift routine",2,"Competency must match the equipment, hazards and assigned responsibilities."],
["Competency","What should a worker do if unfamiliar with a lifting accessory?","Ask for instruction or competent assistance before using it","Guess from its shape","Use it for a small load first","Copy another worker without asking",0,"Understand the equipment and its safe use before operating it."],
["Environmental and Site Hazards","Why must nearby pipelines and process equipment be considered?","They are always strong enough to support loads","They only affect weather","They eliminate the need for barriers","A dropped or swinging load could damage them",3,"Identify vulnerable equipment and suitable clearance controls."],
["Environmental and Site Hazards","What should be done if ground becomes soft after rain?","Continue if the crane is positioned","Reassess ground bearing and crane support before continuing","Add loose scrap under outriggers","Ignore it if the crane is level",1,"Ground conditions can change and affect crane stability."],
["Final Verification","What should be verified immediately before a lift starts?","Only that the engine is running","Only that the load is painted","Rigging, equipment setup, communications, area controls and approvals","Only that the hook is high",2,"Confirm the operation matches the approved plan."],
["Final Verification","What should be done if the sling arrangement differs from the drawing?","Stop and verify the changed arrangement and required approval","Proceed if it looks stronger","Add another sling without recalculating","Ask a worker to balance it manually",0,"An unreviewed change can alter forces and stability."],
["Final Verification","What should happen if the load snags during travel?","Increase force until it releases","Move the crane sideways","Send a worker underneath","Stop and safely resolve the cause",3,"Snagging can create unexpected forces and damage."],
["Final Verification","What is the correct response when a planned lifting method becomes unsafe?","Finish before reporting it","Stop, make the area safe and obtain an approved reassessment","Ask workers to improvise","Continue if the schedule is tight",1,"Safety takes precedence over schedule."]
];

const questionsEl = document.getElementById("questions");
const searchEl = document.getElementById("search");
const topicEl = document.getElementById("topicFilter");
const answerKeyEl = document.getElementById("answerKey");
const keyContentEl = document.getElementById("keyContent");

let checked = false;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[ch]);
}

function validQuestion(q) {
  return Array.isArray(q) &&
    q.length >= 8 &&
    typeof q[0] === "string" &&
    typeof q[1] === "string" &&
    [2,3,4,5].every(i => typeof q[i] === "string") &&
    Number.isInteger(q[6]) && q[6] >= 0 && q[6] <= 3 &&
    typeof q[7] === "string";
}

const invalidQuestions = bank.filter(q => !validQuestion(q));
if (invalidQuestions.length) {
  console.error("Invalid question entries:", invalidQuestions);
}

const all = bank.filter(validQuestion);

function populateTopics() {
  const topics = [...new Set(all.map(q => q[0]))].sort();
  topicEl.innerHTML = '<option value="">All topics</option>';
  topics.forEach(topic => {
    const option = document.createElement("option");
    option.value = topic;
    option.textContent = topic;
    topicEl.appendChild(option);
  });
}

function updateStats() {
  let answered = 0;
  let correct = 0;

  all.forEach((q, i) => {
    const selected = document.querySelector(
      `input[name="q${i}"]:checked`
    );
    if (selected) {
      answered++;
      if (Number(selected.value) === q[6]) correct++;
    }
  });

  document.getElementById("total").textContent = all.length;
  document.getElementById("answered").textContent = answered;
  document.getElementById("correct").textContent = correct;
  document.getElementById("score").textContent =
    answered ? Math.round(correct / answered * 100) + "%" : "—";
}

function markCard(card, i) {
  const q = all[i];
  const correctIndex = q[6];
  const selected = card.querySelector("input:checked");
  const feedback = card.querySelector(".feedback");

  card.querySelectorAll(".option").forEach((label, j) => {
    label.classList.remove("correct", "incorrect");
    if (j === correctIndex) label.classList.add("correct");

    if (selected && j === Number(selected.value) && j !== correctIndex) {
      label.classList.add("incorrect");
    }
  });

  if (!selected) {
    feedback.className = "feedback";
    feedback.textContent = "Not answered.";
    return;
  }

  const isCorrect = Number(selected.value) === correctIndex;
  feedback.className = "feedback " + (isCorrect ? "good" : "bad");
  feedback.textContent =
    (isCorrect ? "Correct. " : "Incorrect. ") +
    "Answer: " + String.fromCharCode(65 + correctIndex) +
    ". " + q[2 + correctIndex] + " — " + q[7];
}

function render() {
  const term = searchEl.value.trim().toLowerCase();
  const topic = topicEl.value;
  questionsEl.innerHTML = "";

  all.forEach((q, i) => {
    if (topic && q[0] !== topic) return;

    const searchable = q.slice(0, 6).join(" ").toLowerCase();
    if (term && !searchable.includes(term)) return;

    const card = document.createElement("article");
    card.className = "question";
    card.id = "q" + i;

    const options = q.slice(2, 6);
    card.innerHTML = `
      <div class="tag">${escapeHTML(q[0])} · Question ${i + 1}</div>
      <h3>${i + 1}. ${escapeHTML(q[1])}</h3>
      <div class="options">
        ${options.map((text, j) => `
          <label class="option">
            <input type="radio" name="q${i}" value="${j}">
            <span><strong>${String.fromCharCode(65 + j)}.</strong>
              ${escapeHTML(text)}</span>
          </label>
        `).join("")}
      </div>
      <div class="feedback" aria-live="polite"></div>
    `;

    questionsEl.appendChild(card);

    card.querySelectorAll('input[type="radio"]').forEach(input => {
      input.addEventListener("change", () => {
        updateStats();
        if (checked) markCard(card, i);
      });
    });

    if (checked) markCard(card, i);
  });

  if (!questionsEl.children.length) {
    questionsEl.innerHTML =
      '<p class="empty">No questions match your search or topic filter.</p>';
  }

  updateStats();
}

function checkAnswers() {
  checked = true;
  all.forEach((q, i) => {
    const card = document.getElementById("q" + i);
    if (card) markCard(card, i);
  });
  updateStats();
}

function buildAnswerKey() {
  keyContentEl.innerHTML = all.map((q, i) => {
    const index = q[6];
    return `
      <div class="key-item">
        <strong>${i + 1}. ${String.fromCharCode(65 + index)} — 
          ${escapeHTML(q[2 + index])}</strong><br>
        ${escapeHTML(q[7])}
      </div>
    `;
  }).join("");
}

function toggleAnswerKey() {
  const opening = getComputedStyle(answerKeyEl).display === "none";
  answerKeyEl.style.display = opening ? "block" : "none";
  document.getElementById("keyBtn").textContent =
    opening ? "Hide Answer Key" : "Show Answer Key";

  if (opening) {
    answerKeyEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

document.getElementById("checkBtn").addEventListener("click", checkAnswers);
document.getElementById("keyBtn").addEventListener("click", toggleAnswerKey);
document.getElementById("printBtn").addEventListener("click", () => window.print());

document.getElementById("resetBtn").addEventListener("click", () => {
  checked = false;
  document.querySelectorAll('#questions input[type="radio"]').forEach(input => {
    input.checked = false;
  });
  answerKeyEl.style.display = "none";
  document.getElementById("keyBtn").textContent = "Show Answer Key";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

searchEl.addEventListener("input", render);
topicEl.addEventListener("change", render);

populateTopics();
buildAnswerKey();
render();
</script>
</body>
</html>
