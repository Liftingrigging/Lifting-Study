<section class="panel" id="craneGeometry">
  <h2>1. Crane Geometry Calculator</h2>
  <p>
    Select two different known values, enter them, then choose the value to calculate.
    Tip height is the vertical side, horizontal radius is the base, and boom length is the hypotenuse.
  </p>

  <div class="grid">
    <div class="field">
      <label for="knownOne">First value you know</label>
      <select id="knownOne">
        <option value="length">Boom length — hypotenuse (m)</option>
        <option value="radius">Horizontal radius — base (m)</option>
        <option value="tipHeight">Tip height — perpendicular (m)</option>
        <option value="angle">Boom angle (°)</option>
      </select>
      <input id="knownOneInput" type="number" step="any" min="0"
             placeholder="Enter first known value">
    </div>

    <div class="field">
      <label for="knownTwo">Second value you know</label>
      <select id="knownTwo">
        <option value="radius">Horizontal radius — base (m)</option>
        <option value="length">Boom length — hypotenuse (m)</option>
        <option value="tipHeight">Tip height — perpendicular (m)</option>
        <option value="angle">Boom angle (°)</option>
      </select>
      <input id="knownTwoInput" type="number" step="any" min="0"
             placeholder="Enter second known value">
    </div>

    <div class="field">
      <label for="findValue">Value you want to find</label>
      <select id="findValue">
        <option value="angle">Boom angle (°)</option>
        <option value="length">Boom length — hypotenuse (m)</option>
        <option value="radius">Horizontal radius — base (m)</option>
        <option value="tipHeight">Tip height — perpendicular (m)</option>
      </select>
    </div>
  </div>

  <div class="actions no-print">
    <button type="button" id="calculateGeometryButton">Calculate</button>
    <button type="button" class="secondary" id="resetGeometryButton">Reset</button>
  </div>

  <div id="geoResults" class="results hidden" aria-live="polite"></div>
</section>

<script>
function calculateGeometry() {
  const first = document.getElementById("knownOne").value;
  const second = document.getElementById("knownTwo").value;
  const target = document.getElementById("findValue").value;
  const firstText = document.getElementById("knownOneInput").value.trim();
  const secondText = document.getElementById("knownTwoInput").value.trim();
  const out = document.getElementById("geoResults");

  const labels = {
    length: "Boom length — hypotenuse",
    radius: "Horizontal radius — base",
    tipHeight: "Tip height — perpendicular",
    angle: "Boom angle"
  };

  const units = {
    length: "m",
    radius: "m",
    tipHeight: "m",
    angle: "°"
  };

  function error(message) {
    out.innerHTML = "";
    const box = document.createElement("div");
    box.className = "status bad";
    box.textContent = message;
    out.appendChild(box);
    out.classList.remove("hidden");
  }

  if (first === second) {
    error("Choose two different known values.");
    return;
  }

  if (target === first || target === second) {
    error("Choose a result different from both known values.");
    return;
  }

  if (firstText === "" || secondText === "") {
    error("Enter both known values.");
    return;
  }

  const a = Number(firstText);
  const b = Number(secondText);

  if (!Number.isFinite(a) || !Number.isFinite(b) || a < 0 || b < 0) {
    error("Enter valid non-negative values.");
    return;
  }

  const v = {};
  v[first] = a;
  v[second] = b;

  // A boom angle must be between 0° and 90°.
  if (v.angle !== undefined && v.angle > 90) {
    error("Boom angle must be between 0° and 90°.");
    return;
  }

  let result;

  // Calculate angle using hypotenuse and base, vertical side,
  // or base and vertical side.
  if (target === "angle") {
    if (v.length !== undefined && v.radius !== undefined) {
      if (v.length <= 0 || v.radius > v.length) {
        error("Boom length must be positive and radius cannot exceed boom length.");
        return;
      }
      result = Math.acos(v.radius / v.length) * 180 / Math.PI;
    } else if (v.length !== undefined && v.tipHeight !== undefined) {
      if (v.length <= 0 || v.tipHeight > v.length) {
        error("Boom length must be positive and tip height cannot exceed boom length.");
        return;
      }
      result = Math.asin(v.tipHeight / v.length) * 180 / Math.PI;
    } else if (v.radius !== undefined && v.tipHeight !== undefined) {
      if (v.radius === 0 && v.tipHeight === 0) {
        error("Radius and tip height cannot both be zero.");
        return;
      }
      result = Math.atan2(v.tipHeight, v.radius) * 180 / Math.PI;
    }
  }

  // Calculate boom length (hypotenuse).
  else if (target === "length") {
    if (v.radius !== undefined && v.tipHeight !== undefined) {
      result = Math.hypot(v.radius, v.tipHeight);
    } else if (v.radius !== undefined && v.angle !== undefined) {
      const cosine = Math.cos(v.angle * Math.PI / 180);
      if (Math.abs(cosine) < 1e-10) {
        error("Boom length cannot be calculated from radius at a 90° angle.");
        return;
      }
      result = v.radius / cosine;
    } else if (v.tipHeight !== undefined && v.angle !== undefined) {
      const sine = Math.sin(v.angle * Math.PI / 180);
      if (Math.abs(sine) < 1e-10) {
        error("Boom length cannot be calculated from tip height at a 0° angle.");
        return;
      }
      result = v.tipHeight / sine;
    }
  }

  // Calculate horizontal radius (base).
  else if (target === "radius") {
    if (v.length !== undefined && v.tipHeight !== undefined) {
      if (v.tipHeight > v.length) {
        error("Tip height cannot exceed boom length.");
        return;
      }
      result = Math.sqrt(Math.max(0, v.length * v.length -
                                     v.tipHeight * v.tipHeight));
    } else if (v.length !== undefined && v.angle !== undefined) {
      result = v.length * Math.cos(v.angle * Math.PI / 180);
    } else if (v.tipHeight !== undefined && v.angle !== undefined) {
      const tangent = Math.tan(v.angle * Math.PI / 180);
      if (Math.abs(tangent) < 1e-10) {
        error("Horizontal radius cannot be calculated from tip height at a 0° angle.");
        return;
      }
      result = v.tipHeight / tangent;
    }
  }

  // Calculate tip height (perpendicular).
  else if (target === "tipHeight") {
    if (v.length !== undefined && v.radius !== undefined) {
      if (v.radius > v.length) {
        error("Horizontal radius cannot exceed boom length.");
        return;
      }
      result = Math.sqrt(Math.max(0, v.length * v.length -
                                     v.radius * v.radius));
    } else if (v.length !== undefined && v.angle !== undefined) {
      result = v.length * Math.sin(v.angle * Math.PI / 180);
    } else if (v.radius !== undefined && v.angle !== undefined) {
      result = v.radius * Math.tan(v.angle * Math.PI / 180);
    }
  }

  if (!Number.isFinite(result) || result < 0) {
    error("These values cannot produce a valid result. Check your inputs.");
    return;
  }

  out.innerHTML = "";

  const heading = document.createElement("h3");
  heading.textContent = "Calculated Result";

  const card = document.createElement("div");
  card.className = "result";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = labels[target];

  const value = document.createElement("div");
  value.className = "value";
  value.textContent = result.toFixed(2) + " " + units[target];

  card.append(name, value);
  out.append(heading, card);
  out.classList.remove("hidden");
}

function resetGeometry() {
  document.getElementById("knownOne").value = "length";
  document.getElementById("knownTwo").value = "radius";
  document.getElementById("findValue").value = "angle";
  document.getElementById("knownOneInput").value = "";
  document.getElementById("knownTwoInput").value = "";

  const out = document.getElementById("geoResults");
  out.innerHTML = "";
  out.classList.add("hidden");
}

document.getElementById("calculateGeometryButton")
  .addEventListener("click", calculateGeometry);

document.getElementById("resetGeometryButton")
  .addEventListener("click", resetGeometry);
</script>
