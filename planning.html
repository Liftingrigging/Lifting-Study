<section class="panel" id="craneGeometry">
  <h2>1. Crane Geometry Calculator</h2>
  <p>Select the two values you know, enter them, and choose the value to calculate.</p>

  <div class="grid">
    <div class="field">
      <label for="knownOne">First value you know</label>
      <select id="knownOne">
        <option value="length">Boom length (m)</option>
        <option value="radius">Horizontal radius (m)</option>
        <option value="angle">Boom angle (°)</option>
      </select>
      <input id="knownOneInput" type="number" step="any" min="0"
             placeholder="Enter first known value">
    </div>

    <div class="field">
      <label for="knownTwo">Second value you know</label>
      <select id="knownTwo">
        <option value="radius">Horizontal radius (m)</option>
        <option value="length">Boom length (m)</option>
        <option value="angle">Boom angle (°)</option>
      </select>
      <input id="knownTwoInput" type="number" step="any" min="0"
             placeholder="Enter second known value">
    </div>

    <div class="field">
      <label for="findValue">Value you want to find</label>
      <select id="findValue">
        <option value="angle">Boom angle (°)</option>
        <option value="length">Boom length (m)</option>
        <option value="radius">Horizontal radius (m)</option>
      </select>
    </div>
  </div>

  <div class="actions no-print">
    <button type="button" onclick="calculateGeometry()">Calculate</button>
    <button type="button" class="secondary" onclick="resetGeometry()">Reset</button>
  </div>

  <div id="geoResults" class="results hidden" aria-live="polite"></div>
</section>

<script>
function calculateGeometry() {
  const first = document.getElementById("knownOne").value;
  const second = document.getElementById("knownTwo").value;
  const target = document.getElementById("findValue").value;
  const firstText = document.getElementById("knownOneInput").value;
  const secondText = document.getElementById("knownTwoInput").value;
  const out = document.getElementById("geoResults");

  const labels = {
    length: "Boom length",
    radius: "Horizontal radius",
    angle: "Boom angle"
  };
  const units = {length:"m", radius:"m", angle:"°"};

  function showError(text) {
    out.innerHTML = '<div class="status bad">' + text + '</div>';
    out.classList.remove("hidden");
  }

  if (first === second) {
    showError("Choose two different known values.");
    return;
  }
  if (target === first || target === second) {
    showError("Choose a result different from both known values.");
    return;
  }
  if (firstText.trim() === "" || secondText.trim() === "") {
    showError("Enter both known values.");
    return;
  }

  const a = Number(firstText);
  const b = Number(secondText);

  if (!Number.isFinite(a) || !Number.isFinite(b) || a < 0 || b < 0) {
    showError("Enter valid non-negative values.");
    return;
  }

  const v = {};
  v[first] = a;
  v[second] = b;

  let result;

  if (target === "angle") {
    if (v.length <= 0 || v.radius > v.length) {
      showError("Boom length must be positive, and radius cannot exceed boom length.");
      return;
    }
    result = Math.acos(Math.min(1, v.radius / v.length)) * 180 / Math.PI;
  } else if (target === "radius") {
    if (v.length <= 0 || v.angle > 90) {
      showError("Enter a positive boom length and an angle from 0° to 90°.");
      return;
    }
    result = v.length * Math.cos(v.angle * Math.PI / 180);
  } else if (target === "length") {
    if (v.angle > 90 || (v.angle === 90 && v.radius > 0)) {
      showError("These values do not produce valid straight-boom geometry.");
      return;
    }
    result = v.radius / Math.cos(v.angle * Math.PI / 180);
  }

  if (!Number.isFinite(result)) {
    showError("This combination cannot produce a valid result. Check your inputs.");
    return;
  }

  out.innerHTML =
    '<h3>Calculated Result</h3>' +
    '<div class="result"><div class="name">' + labels[target] +
    '</div><div class="value">' + result.toFixed(2) + ' ' +
    units[target] + '</div></div>';
  out.classList.remove("hidden");
}

function resetGeometry() {
  document.getElementById("knownOne").value = "length";
  document.getElementById("knownTwo").value = "radius";
  document.getElementById("findValue").value = "angle";
  document.getElementById("knownOneInput").value = "";
  document.getElementById("knownTwoInput").value = "";
  document.getElementById("geoResults").classList.add("hidden");
}
</script>
