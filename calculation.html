<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lifting Calculations</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 30px;
      color: #1f2937;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      color: #163a5f;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      font-size: 15px;
    }

    .open-btn {
      background: #163a5f;
      color: white;
    }

    .folder {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border: 1px solid #d8e0e8;
      border-radius: 10px;
    }

    .folder h2 {
      font-size: 20px;
      margin-top: 0;
    }

    .calculator-list {
      display: grid;
      gap: 12px;
    }

    .calculator-btn {
      width: 100%;
      text-align: left;
      background: #edf4fb;
      color: #163a5f;
      border: 1px solid #cbdced;
    }

    .calculator-btn:hover {
      background: #dceafa;
    }

    #calculations {
      display: none;
    }

    #calculator-content {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      border: 1px solid #d8e0e8;
    }

    .back-btn {
      margin-top: 12px;
      background: #e5e7eb;
      color: #111827;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Lifting Calculations</h1>

    <button class="open-btn" onclick="openCalculations()">
      Open Calculations
    </button>

    <section id="calculations">
      <div class="folder">
        <h2>📁 Weight &amp; Load Study</h2>

        <div class="calculator-list">
          <button class="calculator-btn"
                  onclick="openCalculator('material')">
            ⚖️ Material Weight Calculator
          </button>

          <button class="calculator-btn"
                  onclick="openCalculator('cog')">
            📍 Center of Gravity Calculator
          </button>
        </div>
      </div>

      <div id="calculator-content" hidden>
        <h2 id="calculator-title"></h2>
        <p id="calculator-description"></p>
        <button class="back-btn" onclick="closeCalculator()">
          Back to Weight &amp; Load Study
        </button>
      </div>
    </section>
  </div>

  <script>
    function openCalculations() {
      document.getElementById("calculations").style.display = "block";
    }

    function openCalculator(type) {
      const title = document.getElementById("calculator-title");
      const description =
        document.getElementById("calculator-description");
      const content = document.getElementById("calculator-content");

      if (type === "material") {
        title.textContent = "Material Weight Calculator";
        description.textContent =
          "Connect your existing material weight calculation form here.";
      } else if (type === "cog") {
        title.textContent = "Center of Gravity Calculator";
        description.textContent =
          "Connect your existing center of gravity calculation form here.";
      }

      content.hidden = false;
    }

    function closeCalculator() {
      document.getElementById("calculator-content").hidden = true;
    }
  </script>
</body>
</html>
