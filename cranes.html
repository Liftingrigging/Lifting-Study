<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Cranes | Lifting Study</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .cl {
      max-width: 1200px;
      margin: auto;
    }

    .cl h1 { margin-bottom: 8px; }
    .cl p { line-height: 1.6; }

    .cl-controls {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 12px;
      margin: 20px 0;
    }

    .cl input, .cl select, .cl button {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    .cl button {
      cursor: pointer;
      background: #075985;
      color: white;
      border: 0;
      font-weight: 600;
    }

    .cl button:hover { background: #0c4a6e; }

    .cl-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .cl-panel {
      background: white;
      border: 1px solid #dbe3ee;
      border-radius: 12px;
      padding: 18px;
    }

    .cl-list {
      display: grid;
      gap: 8px;
    }

    .cl-item {
      width: 100%;
      text-align: left;
      background: #f1f5f9 !important;
      color: #172033 !important;
      border: 1px solid #dbe3ee !important;
    }

    .cl-item.active {
      background: #e0f2fe !important;
      border-color: #0284c7 !important;
    }

    .cl-detail h2 { margin-top: 0; }

    .cl-tag {
      display: inline-block;
      padding: 5px 9px;
      margin: 3px;
      border-radius: 20px;
      background: #e0f2fe;
      color: #075985;
      font-size: 13px;
    }

    .cl-diagram {
      min-height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 16px 0;
      border-radius: 10px;
      background: #eff6ff;
      font-size: 64px;
    }

    .cl-detail h3 { margin-bottom: 6px; }

    .cl-detail li { margin-bottom: 6px; line-height: 1.5; }

    .cl-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .cl-actions button { flex: 1 1 160px; }

    .cl-secondary { background: #334155 !important; }

    .cl-empty {
      padding: 20px;
      color: #64748b;
      text-align: center;
    }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .cl-controls, .cl-layout { grid-template-columns: 1fr; }
    }

    @media print {
      .cl-controls, .cl-list-panel, .cl-actions { display: none !important; }
      body { padding: 0; background: white; }
      .cl-panel { border: 0; }
    }
  </style>
</head>

<body>
<section id="crane-library" class="cl">
  <h1>Explore Cranes</h1>
  <p>Select a crane to explore its applications, main components, safety checks, and operating considerations.</p>

  <div class="cl-controls">
    <input id="craneSearch" type="search" placeholder="Search cranes..." aria-label="Search cranes">
    <select id="craneCategory" aria-label="Filter by crane category">
      <option value="all">All crane types</option>
      <option value="mobile">Mobile cranes</option>
      <option value="fixed">Fixed cranes</option>
      <option value="industrial">Industrial cranes</option>
      <option value="special">Special-purpose cranes</option>
    </select>
  </div>

  <div class="cl-layout">
    <aside class="cl-panel cl-list-panel">
      <h2>Crane Library</h2>
      <div id="craneList" class="cl-list"></div>
      <p id="craneCount" aria-live="polite"></p>
    </aside>

    <main id="craneDetail" class="cl-panel cl-detail" aria-live="polite">
      <h2>Choose a crane</h2>
      <p>Select a crane from the list to view its details.</p>
    </main>
  </div>
</section>

<script>
(function () {
  "use strict";

  const cranes = [
    {
      id: "truck",
      name: "Truck-Mounted Crane",
      category: "mobile",
      icon: "🚚",
      description: "A crane mounted on a truck chassis for lifting at multiple locations.",
      applications: ["Construction projects", "Equipment installation", "General material handling"],
      components: ["Carrier vehicle", "Boom", "Hoist and hook", "Outriggers", "Counterweight where fitted"],
      checks: ["Inspect the boom, hook, wire rope and rigging.", "Deploy outriggers according to the manufacturer’s instructions.", "Check ground bearing capacity and setup level.", "Confirm the load chart and rated capacity."],
      hazards: ["Overturning", "Overhead power lines", "Excessive radius", "Unstable ground"],
      categoryLabel: "Mobile crane"
    },
    {
      id: "crawler",
      name: "Crawler Crane",
      category: "mobile",
      icon: "🏗️",
      description: "A crane supported by crawler tracks, often used for heavy lifting on large projects.",
      applications: ["Infrastructure", "Heavy construction", "Industrial projects"],
      components: ["Crawler tracks", "Boom", "Hoist system", "Counterweight", "Operator cab"],
      checks: ["Inspect tracks and travel path.", "Verify boom configuration and load chart.", "Check counterweights and connections.", "Assess ground stability along the lifting route."],
      hazards: ["Ground settlement", "Boom configuration errors", "Load swing", "Traveling with an unsuitable load"],
      categoryLabel: "Mobile crane"
    },
    {
      id: "tower",
      name: "Tower Crane",
      category: "fixed",
      icon: "🏗️",
      description: "A tall fixed crane commonly used to lift materials on building construction sites.",
      applications: ["High-rise buildings", "Building materials", "Large construction sites"],
      components: ["Mast", "Jib", "Trolley", "Hoist", "Slewing unit", "Foundation or climbing system"],
      checks: ["Verify inspection and erection records.", "Check limit switches and safety devices.", "Inspect ropes, hook and trolley.", "Follow wind-speed limits and site lifting plans."],
      hazards: ["High winds", "Collision with nearby cranes", "Falling objects", "Unsafe access"],
      categoryLabel: "Fixed crane"
    },
    {
      id: "rough-terrain",
      name: "Rough-Terrain Crane",
      category: "mobile",
      icon: "🚜",
      description: "A mobile crane designed for maneuvering on rough or uneven construction terrain.",
      applications: ["Remote construction sites", "Industrial maintenance", "Uneven-site lifting"],
      components: ["All-terrain tires", "Boom", "Outriggers", "Hoist", "Carrier chassis"],
      checks: ["Check tire condition and chassis.", "Set up on suitable ground.", "Deploy outriggers as specified.", "Use the correct load chart for the configuration."],
      hazards: ["Sloping ground", "Overturning", "Poor visibility", "Unexpected ground movement"],
      categoryLabel: "Mobile crane"
    },
    {
      id: "overhead",
      name: "Overhead Bridge Crane",
      category: "industrial",
      icon: "🏭",
      description: "A crane that moves loads along elevated runway rails inside facilities.",
      applications: ["Factories", "Warehouses", "Maintenance workshops"],
      components: ["Bridge girder", "End trucks", "Runway rails", "Trolley", "Hoist"],
      checks: ["Inspect the hook, hoist and ropes or chain.", "Check brakes and travel limits.", "Inspect runway and visible structural components.", "Test controls and warning devices as required."],
      hazards: ["Suspended loads", "Crushing points", "Overloading", "Unintended movement"],
      categoryLabel: "Industrial crane"
    },
    {
      id: "gantry",
      name: "Gantry Crane",
      category: "industrial",
      icon: "🏗️",
      description: "A crane supported by legs that travel on wheels or rails at ground level.",
      applications: ["Ports", "Shipyards", "Outdoor storage yards"],
      components: ["Main girder", "Supporting legs", "Hoist trolley", "Wheels or rail bogies", "Controls"],
      checks: ["Inspect wheels and rails.", "Check hoist and lifting accessories.", "Confirm the load is within the rated capacity.", "Keep the travel path clear."],
      hazards: ["Crushing during travel", "Wind exposure", "Uneven travel surfaces", "Load swing"],
      categoryLabel: "Industrial crane"
    },
    {
      id: "jib",
      name: "Jib Crane",
      category: "fixed",
      icon: "⚙️",
      description: "A crane with a horizontal or angled jib used for localized lifting.",
      applications: ["Workstations", "Machine shops", "Assembly areas"],
      components: ["Jib arm", "Mast or wall bracket", "Hoist", "Slewing mechanism", "Anchors"],
      checks: ["Inspect the jib arm and mounting points.", "Check anchors and fasteners.", "Inspect hoist, hook and controls.", "Confirm the working radius and rated capacity."],
      hazards: ["Anchor failure", "Overloading", "Pinch points", "Uncontrolled rotation"],
      categoryLabel: "Fixed crane"
    },
    {
      id: "floating",
      name: "Floating Crane",
      category: "special",
      icon: "🚢",
      description: "A crane mounted on a floating platform for marine and offshore lifting.",
      applications: ["Port construction", "Marine salvage", "Offshore projects"],
      components: ["Floating platform", "Crane boom", "Hoist", "Mooring system", "Ballast system"],
      checks: ["Review marine conditions and lift plan.", "Verify platform stability and ballast arrangements.", "Inspect crane and rigging.", "Confirm communications and emergency arrangements."],
      hazards: ["Vessel motion", "Weather and sea state", "Changing load dynamics", "Mooring failure"],
      categoryLabel: "Special-purpose crane"
    },
    {
      id: "articulating",
      name: "Articulating Boom Crane",
      category: "mobile",
      icon: "🚛",
      description: "A crane with a jointed boom that folds for transport and extends for lifting.",
      applications: ["Truck loading", "Delivery operations", "Construction materials"],
      components: ["Articulated boom", "Hydraulic cylinders", "Stabilizers", "Hook or attachment", "Controls"],
      checks: ["Inspect hydraulic hoses and cylinders.", "Deploy stabilizers correctly.", "Check attachments and lifting points.", "Follow the capacity chart for the actual boom position."],
      hazards: ["Hydraulic failure", "Unstable setup", "Pinch points", "Overloading at extended reach"],
      categoryLabel: "Mobile crane"
    }
  ];

  const list = document.getElementById("craneList");
  const detail = document.getElementById("craneDetail");
  const search = document.getElementById("craneSearch");
  const category = document.getElementById("craneCategory");
  const count = document.getElementById("craneCount");

  let selectedId = "truck";

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char];
    });
  }

  function renderList() {
    const query = search.value.trim().toLowerCase();
    const selectedCategory = category.value;

    const filtered = cranes.filter(function (crane) {
      const text = [
        crane.name,
        crane.description,
        crane.categoryLabel,
        ...crane.applications
      ].join(" ").toLowerCase();

      return text.includes(query) &&
        (selectedCategory === "all" || crane.category === selectedCategory);
    });

    list.innerHTML = "";

    if (filtered.length === 0) {
      list.innerHTML = '<div class="cl-empty">No cranes match your search.</div>';
    } else {
      filtered.forEach(function (crane) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cl-item" + (crane.id === selectedId ? " active" : "");
        button.dataset.craneId = crane.id;
        button.textContent = crane.icon + "  " + crane.name;
        list.appendChild(button);
      });
    }

    count.textContent = filtered.length + " crane type(s) found.";

    if (!filtered.some(function (crane) { return crane.id === selectedId; })) {
      if (filtered.length) {
        selectedId = filtered[0].id;
        renderList();
        renderDetail(selectedId);
      } else {
        detail.innerHTML = "<h2>No results</h2><p>Try another search or category.</p>";
      }
    }
  }

  function makeList(items) {
    return "<ul>" + items.map(function (item) {
      return "<li>" + escapeHTML(item) + "</li>";
    }).join("") + "</ul>";
  }

  function renderDetail(id) {
    const crane = cranes.find(function (item) {
      return item.id === id;
    });

    if (!crane) {
      detail.innerHTML = "<h2>Crane not found</h2>";
      return;
    }

    selectedId = id;

    detail.innerHTML =
      "<h2>" + escapeHTML(crane.icon + " " + crane.name) + "</h2>" +
      '<span class="cl-tag">' + escapeHTML(crane.categoryLabel) + "</span>" +
      "<p>" + escapeHTML(crane.description) + "</p>" +
      '<div class="cl-diagram" role="img" aria-label="' +
      escapeHTML(crane.name) + ' symbol">' + escapeHTML(crane.icon) + "</div>" +
      "<h3>Typical Applications</h3>" + makeList(crane.applications) +
      "<h3>Main Components</h3>" + makeList(crane.components) +
      "<h3>Pre-use Safety Checks</h3>" + makeList(crane.checks) +
      "<h3>Key Hazards</h3>" + makeList(crane.hazards) +
      "<p><strong>Important:</strong> This is general study information, not a substitute for the crane manufacturer's instructions, an approved lift plan, or applicable regulations.</p>" +
      '<div class="cl-actions">' +
        '<button type="button" id="cranePrintOne">Print / Save PDF</button>' +
        '<button type="button" id="cranePrintAll" class="cl-secondary">Print All Crane Sheets</button>' +
      "</div>";

    renderList();

    document.getElementById("cranePrintOne").addEventListener("click", function () {
      printSheets([crane]);
    });

    document.getElementById("cranePrintAll").addEventListener("click", function () {
      printSheets(cranes);
    });
  }

  function printSheets(items) {
    const printWindow = window.open("", "_blank");

    if (!printWindow) {
      alert("Please allow pop-ups for this page to print or save as PDF.");
      return;
    }

    const pages = items.map(function (crane) {
      return '<section class="sheet">' +
        "<h1>" + escapeHTML(crane.name) + "</h1>" +
        "<p><strong>Category:</strong> " + escapeHTML(crane.categoryLabel) + "</p>" +
        "<p>" + escapeHTML(crane.description) + "</p>" +
        "<h2>Typical Applications</h2>" + makeList(crane.applications) +
        "<h2>Main Components</h2>" + makeList(crane.components) +
        "<h2>Pre-use Safety Checks</h2>" + makeList(crane.checks) +
        "<h2>Key Hazards</h2>" + makeList(crane.hazards) +
        "<p><strong>Note:</strong> Always follow manufacturer instructions, the approved lift plan, and applicable regulations.</p>" +
        "</section>";
    }).join("");

    printWindow.document.write(
      "<!DOCTYPE html><html><head><title>Crane Study Sheets</title>" +
      '<meta charset="UTF-8"><style>' +
      "body{font-family:Arial,sans-serif;color:#172033;line-height:1.5;padding:20px}" +
      ".sheet{page-break-after:always;break-after:page;padding:10px}" +
      "h1{color:#075985}li{margin-bottom:6px}" +
      "@media print{button{display:none}}" +
      "</style></head><body>" + pages +
      '<script>window.onload=function(){window.print();};<\/script>' +
      "</body></html>"
    );

    printWindow.document.close();
  }

  search.addEventListener("input", renderList);
  category.addEventListener("change", renderList);

  list.addEventListener("click", function (event) {
    const button = event.target.closest("button[data-crane-id]");
    if (!button) return;
    renderDetail(button.dataset.craneId);
  });

  renderList();
  renderDetail(selectedId);
})();
</script>
</body>
</html>
